name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e

  deploy-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 2
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
      pull-requests: write
    environment:
      name: pr-preview-2
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy PR #2 branch
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployed URL on PR #2
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body: `PR #2 branch deployment succeeded: ${process.env.PAGE_URL}`
            })
