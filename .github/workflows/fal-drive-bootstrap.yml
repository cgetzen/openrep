name: Wrong Channel Fal transfer bootstrap

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  stage:
    if: startsWith(github.event.issue.title, '[fal-to-drive]')
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: https://v3b.fal.media/files/b/0aa93078/ntyWUV9-bgLu0fpW1Pb1l_minimax-h3.mp4
      FILE_NAME: wc_e001_s006_connor_side_h3max_t01_raw.mp4
    steps:
      - name: Download and validate Fal video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/out/$FILE_NAME" "$SOURCE_URL"
          test -s "$RUNNER_TEMP/out/$FILE_NAME"
          bytes="$(stat -c %s "$RUNNER_TEMP/out/$FILE_NAME")"
          test "$bytes" = "11319790"
          sha256sum "$RUNNER_TEMP/out/$FILE_NAME"

      - name: Upload connector-downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrong-channel-fal-video
          path: ${{ runner.temp }}/out/${{ env.FILE_NAME }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Report run id
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body "ARTIFACT_READY run_id=${GITHUB_RUN_ID} name=wrong-channel-fal-video"
